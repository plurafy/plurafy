<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <!-- Gradients Light Theme -->
    <linearGradient id="grad-book-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <linearGradient id="grad-spark-light" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="grad-cap-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4338CA" />
    </linearGradient>
  </defs>

  <!-- ================= RIGHT SIDE: LIGHT THEME ================= -->
  <g transform="translate(0, 0)">
    <!-- Background Grid Accent -->
    <circle cx="150" cy="150" r="140" fill="none" class="grid-line-light" />
    <circle cx="150" cy="150" r="100" fill="none" class="grid-line-light" />

    <!-- LOGO ICON (LIGHT) -->
    <g transform="translate(140, 210)">
      
      <!-- Open Book / Digital Platform Base -->
      <!-- Left Page -->
      <path d="M -110,30 C -60,10 -20,35 0,55 L 0,-55 C -20,-75 -60,-50 -110,-30 Z" 
            fill="url(#grad-book-light)" opacity="0.85" />
      
      <!-- Right Page -->
      <path d="M 110,30 C 60,10 20,35 0,55 L 0,-55 C 20,-75 60,-50 110,-30 Z" 
            fill="url(#grad-book-light)" />

      <!-- Inner Page Layers / Tech Lines -->
      <path d="M -90,45 C -50,28 -15,50 0,65" fill="none" stroke="#38BDF8" stroke-width="5" stroke-linecap="round" opacity="0.9" />
      <path d="M 90,45 C 50,28 15,50 0,65" fill="none" stroke="#38BDF8" stroke-width="5" stroke-linecap="round" opacity="0.9" />

      <!-- Graduation Cap / Ascending Growth Top -->
      <path d="M 0,-130 L 110,-75 L 0,-20 L -110,-75 Z" fill="url(#grad-cap-light)" />
      
      <!-- Cap Under-Shadow & Depth -->
      <path d="M 0,-20 L 75,-57 L 75,-25 C 75,10 0,40 0,40 C 0,40 -75,10 -75,-25 L -75,-57 Z" fill="url(#grad-cap-light)" opacity="0.7" />
      
      <!-- Graduation Tassel / Digital Node Path -->
      <path d="M 110,-75 C 125,-50 130,-20 130,10" fill="none" stroke="#D97706" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 2" />
      <circle cx="130" cy="15" r="7" fill="#D97706" />

      <!-- Rising Knowledge / AI Sparks (Nodes) -->
      <path d="M 0,-145 L 0,-175" stroke="url(#grad-spark-light)" stroke-width="6" stroke-linecap="round" />
      <path d="M -60,-130 L -80,-150" stroke="url(#grad-spark-light)" stroke-width="5" stroke-linecap="round" />
      <path d="M 60,-130 L 80,-150" stroke="url(#grad-spark-light)" stroke-width="5" stroke-linecap="round" />
      
      <circle cx="0" cy="-185" r="6" fill="#059669" />
      <circle cx="-88" cy="-158" r="5" fill="#D97706" />
      <circle cx="88" cy="-158" r="5" fill="#0284C7" />
    </g>
  </g>
</svg>

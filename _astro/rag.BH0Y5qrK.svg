<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 480" width="100%" height="100%">
  <defs>
    <style>
      :root {
        --bg-color: #ffffff;
        --box-bg: #ffffff;
        --box-stroke: #333333;
        --text-primary: #111111;
        --arrow-color: #333333;
        --divider-color: #ffe0d0;
        --indexing-title: #e50914;
        --retrieval-title: #4b127b;
        --pdf-bg: #e50914;
        --pdf-text: #ffffff;
        --db-bg: #ffffff;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg-color: #0d1117;
          --box-bg: #161b22;
          --box-stroke: #8b949e;
          --text-primary: #f0f6fc;
          --arrow-color: #c9d1d9;
          --divider-color: #30363d;
          --indexing-title: #ff5555;
          --retrieval-title: #a855f7;
          --pdf-bg: #ff5555;
          --pdf-text: #ffffff;
          --db-bg: #161b22;
        }
      }

      .bg { fill: var(--bg-color); }
      .box { fill: var(--box-bg); stroke: var(--box-stroke); stroke-width: 1.5; }
      .text { font-family: system-ui, -apple-system, sans-serif; fill: var(--text-primary); text-anchor: middle; dominant-baseline: middle; }
      .arrow { stroke: var(--arrow-color); stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }
      .divider { stroke: var(--divider-color); stroke-width: 1.5; stroke-dasharray: none; }
      
      .title-indexing { font-family: system-ui, -apple-system, sans-serif; font-weight: bold; font-size: 18px; fill: var(--indexing-title); }
      .title-retrieval { font-family: system-ui, -apple-system, sans-serif; font-weight: bold; font-size: 18px; fill: var(--retrieval-title); }
    </style>

    <!-- Marker for Arrowheads -->
    <marker id="arrowhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="var(--arrow-color)" />
    </marker>
  </defs>

  <!-- Background -->
  <rect class="bg" width="100%" height="100%" />

  <!-- Section Titles -->
  <text x="110" y="180" class="title-indexing">Indexing</text>
  <text x="170" y="420" class="title-retrieval">Retrieval and Generation</text>

  <!-- Section Separator Line -->
  <line x1="0" y1="200" x2="660" y2="200" class="divider" />

  <!-- ================= INDEXING SECTION ================= -->

  <!-- PDF Icon -->
  <g transform="translate(30, 65)">
    <path d="M 5 0 L 35 0 L 50 15 L 50 65 C 50 67 48 69 46 69 L 5 69 C 3 69 1 67 1 65 L 1 4 C 1 2 3 0 5 0 Z" fill="#e0e0e0" stroke="var(--box-stroke)" stroke-width="1.5" />
    <path d="M 35 0 L 35 15 L 50 15 Z" fill="#b0b0b0" stroke="var(--box-stroke)" stroke-width="1.5" />
    <rect x="0" y="28" width="42" height="18" rx="2" fill="var(--pdf-bg)" />
    <text x="21" y="37" font-family="system-ui, sans-serif" font-weight="bold" font-size="11" fill="var(--pdf-text)" text-anchor="middle" dominant-baseline="middle">PDF</text>
  </g>

  <!-- Document Loader Box -->
  <rect x="155" y="68" width="130" height="60" class="box" />
  <text x="220" y="88" class="text" font-size="13">Document</text>
  <text x="220" y="103" class="text" font-size="13">Loader and Text</text>
  <text x="220" y="118" class="text" font-size="13">Splitter</text>

  <!-- Text Chunks -->
  <g transform="translate(310, 25)">
    <rect x="0" y="0" width="100" height="30" class="box" />
    <text x="50" y="15" class="text" font-size="12">Text Chunk</text>
    
    <rect x="0" y="45" width="100" height="30" class="box" />
    <text x="50" y="60" class="text" font-size="12">Text Chunk</text>
    
    <rect x="0" y="90" width="100" height="30" class="box" />
    <text x="50" y="105" class="text" font-size="12">Text Chunk</text>
    
    <rect x="0" y="135" width="100" height="30" class="box" />
    <text x="50" y="150" class="text" font-size="12">Text Chunk</text>
  </g>

  <!-- Embedding Generation Model (Top) -->
  <rect x="445" y="25" width="125" height="165" class="box" />
  <text x="507" y="92" class="text" font-size="13">Embedding</text>
  <text x="507" y="108" class="text" font-size="13">Generation</text>
  <text x="507" y="124" class="text" font-size="13">Model</text>

  <!-- Indexing Arrows -->
  <path d="M 82 98 L 155 98" class="arrow" />
  <path d="M 285 98 L 310 40" class="arrow" />
  <path d="M 285 98 L 310 85" class="arrow" />
  <path d="M 285 98 L 310 130" class="arrow" />
  <path d="M 285 98 L 310 175" class="arrow" />
  
  <path d="M 410 40 L 445 40" class="arrow" />
  <path d="M 410 85 L 445 85" class="arrow" />
  <path d="M 410 130 L 445 130" class="arrow" />
  <path d="M 410 175 L 445 175" class="arrow" />

  <path d="M 570 120 L 660 120" class="arrow" />
  <text x="615" y="108" class="text" font-size="12">Embeddings</text>


  <!-- ================= RETRIEVAL & GENERATION SECTION ================= -->

  <!-- User Icon -->
  <g transform="translate(60, 245)">
    <circle cx="25" cy="16" r="14" fill="none" stroke="var(--box-stroke)" stroke-width="2" />
    <path d="M 2 48 C 2 34 12 30 25 30 C 38 30 48 34 48 48" fill="none" stroke="var(--box-stroke)" stroke-width="2" />
    <text x="25" y="65" class="text" font-size="12">User</text>
  </g>

  <!-- Query Oval -->
  <ellipse cx="280" cy="260" rx="45" ry="25" class="box" />
  <text x="280" y="260" class="text" font-size="13">Query</text>

  <!-- Embedding Generation Model (Bottom) -->
  <rect x="350" y="232" width="125" height="60" class="box" />
  <text x="412" y="252" class="text" font-size="12">Embedding</text>
  <text x="412" y="266" class="text" font-size="12">Generation</text>
  <text x="412" y="280" class="text" font-size="12">Model</text>

  <!-- Query Embedding Box -->
  <rect x="500" y="242" width="95" height="40" class="box" />
  <text x="547" y="255" class="text" font-size="12">Query</text>
  <text x="547" y="270" class="text" font-size="12">Embedding</text>

  <!-- Answer Box -->
  <rect x="175" y="348" width="60" height="30" class="box" />
  <text x="205" y="363" class="text" font-size="12">Answer</text>

  <!-- LLM Box -->
  <rect x="290" y="348" width="50" height="30" class="box" />
  <text x="315" y="363" class="text" font-size="12">LLM</text>

  <!-- Retrieval Arrows -->
  <path d="M 110 270 L 235 260" class="arrow" />
  <path d="M 325 260 L 350 260" class="arrow" />
  <path d="M 475 260 L 500 260" class="arrow" />
  <path d="M 595 260 L 660 260" class="arrow" />
  <text x="625" y="232" class="text" font-size="12">Similarity</text>
  <text x="625" y="248" class="text" font-size="12">search</text>

  <path d="M 280 285 L 280 360 L 290 360" class="arrow" />
  <path d="M 660 363 L 340 363" class="arrow" />
  <text x="500" y="350" class="text" font-size="12">Top - k matches</text>

  <path d="M 290 368 L 235 368" class="arrow" />
  <path d="M 175 363 L 145 363 L 145 280 L 110 280" class="arrow" />

  <!-- ================= VECTOR DATABASE ================= -->
  <g transform="translate(660, 40)">
    <!-- Main Cylinder Body -->
    <path d="M 0 30 L 0 330 A 70 25 0 0 0 140 330 L 140 30 Z" fill="var(--db-bg)" stroke="var(--box-stroke)" stroke-width="1.5" />
    <!-- Top Ellipse -->
    <ellipse cx="70" cy="30" rx="70" ry="25" fill="var(--db-bg)" stroke="var(--box-stroke)" stroke-width="1.5" />
    <!-- DB Text -->
    <text x="70" y="180" class="text" font-size="14" font-weight="500">Vector Database</text>
  </g>

</svg>

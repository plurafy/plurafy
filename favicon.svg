<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <!-- Gradients Dark Theme -->
    <linearGradient id="grad-book-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    
    <linearGradient id="grad-spark-dark" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <linearGradient id="grad-cap-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
  </defs>


  <!-- ================= LEFT SIDE: DARK THEME ================= -->
  <g transform="translate(0, 0)">

    <!-- LOGO ICON (DARK) -->
    <g transform="translate(140, 210)">
      
      <!-- Open Book / Digital Platform Base -->
      <!-- Left Page -->
      <path d="M -110,30 C -60,10 -20,35 0,55 L 0,-55 C -20,-75 -60,-50 -110,-30 Z" 
            fill="url(#grad-book-dark)" opacity="0.9" />
      
      <!-- Right Page -->
      <path d="M 110,30 C 60,10 20,35 0,55 L 0,-55 C 20,-75 60,-50 110,-30 Z" 
            fill="url(#grad-book-dark)" />

      <!-- Inner Page Layers / Tech Lines -->
      <path d="M -90,45 C -50,28 -15,50 0,65" fill="none" stroke="#38BDF8" stroke-width="5" stroke-linecap="round" opacity="0.8" />
      <path d="M 90,45 C 50,28 15,50 0,65" fill="none" stroke="#38BDF8" stroke-width="5" stroke-linecap="round" opacity="0.8" />

      <!-- Graduation Cap / Ascending Growth Top -->
      <path d="M 0,-130 L 110,-75 L 0,-20 L -110,-75 Z" fill="url(#grad-cap-dark)" />
      
      <!-- Cap Under-Shadow & Depth -->
      <path d="M 0,-20 L 75,-57 L 75,-25 C 75,10 0,40 0,40 C 0,40 -75,10 -75,-25 L -75,-57 Z" fill="url(#grad-cap-dark)" opacity="0.6" />
      
      <!-- Graduation Tassel / Digital Node Path -->
      <path d="M 110,-75 C 125,-50 130,-20 130,10" fill="none" stroke="#F59E0B" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 2" />
      <circle cx="130" cy="15" r="7" fill="#F59E0B" />

      <!-- Rising Knowledge / AI Sparks (Nodes) -->
      <path d="M 0,-145 L 0,-175" stroke="url(#grad-spark-dark)" stroke-width="6" stroke-linecap="round" />
      <path d="M -60,-130 L -80,-150" stroke="url(#grad-spark-dark)" stroke-width="5" stroke-linecap="round" />
      <path d="M 60,-130 L 80,-150" stroke="url(#grad-spark-dark)" stroke-width="5" stroke-linecap="round" />
      
      <circle cx="0" cy="-185" r="6" fill="#10B981" />
      <circle cx="-88" cy="-158" r="5" fill="#F59E0B" />
      <circle cx="88" cy="-158" r="5" fill="#38BDF8" />
    </g>
  </g>
</svg>
